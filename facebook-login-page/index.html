<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="main-container">
    <div class="left-section">
      <h1 class="logo-text">facebook</h1>
      <p class="tagline">Facebook helps you connect and share with the people in your life.</p>
    </div>

    <div class="right-section">
      <div class="login-card" id="loginCard">
        <form class="login-form" id="loginForm">
          <input type="text" class="input-field" id="emailInput" placeholder="Email address or phone number">
          <input type="password" class="input-field" id="passwordInput" placeholder="Password">
          <button type="submit" class="login-btn" id="loginBtn">Log in</button>
          <a href="#" class="forgot-link" id="forgotLink">Forgotten password?</a>
          <div class="divider" id="divider"></div>
          <button type="button" class="create-btn" id="createBtn">Create new account</button>
        </form>
      </div>
      <p class="page-link"><a href="#" id="pageLink">Create a Page</a> for a celebrity, brand or business.</p>
    </div>
  </div>

  <!-- Login PopUp -->

<div class="success-alert" id="successAlert">
  <span class="alert-icon" id="alertIcon">✓</span>
  <span class="alert-text" id="alertText">Login Successful! Welcome back.</span>
</div>

  <script src="script.js"></script>
</body>
</html>
