<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Inventory Item Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

<div class="inventory">
  <h2>Game Inventory</h2>
  <p>Manage your collected items</p>

  <div class="item-card">
    <h3>⚔️ Shadow Sword</h3>
    <p>Rarity: Legendary</p>
    <p class="description" id="itmDiscription">A powerful dark sword.</p>
    <button id="inspectBtn">Inspect Item</button>
  </div>

  <div class="details" id="specialItmDetails">
    <h3>Item Details</h3>
    <p id="itemDetails">Select Inspect to view details.</p>

    <p id="itmSpeciality"><b>Rarity = <span style="color: red; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Mythic</span></b><br>
    <b>Speciality = <span style="color: blue; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif">Its Special Ability To Kill One Shot.</span></b>
    </p>

    <button id="specialBtn">Show Special Details</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
