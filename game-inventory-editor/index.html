
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="quest-board">
    <h1>⚔ Quest Board</h1>
    <p>Complete your daily missions</p>

    <button id="completeAll">Complete All Quests</button>

    <section class="quest-list">
      <article class="quest">
        <h3>Learn JavaScript</h3>
        <p>Reward: 100 XP</p>
        <p class="status">Status: Incomplete</p>
        <button class="completeBtn">Complete</button>
      </article>

      <article class="quest">
        <h3>Practice DOM</h3>
        <p>Reward: 150 XP</p>
        <p class="status">Status: Incomplete</p>
        <button class="completeBtn">Complete</button>
      </article>

      <article class="quest">
        <h3>Build a Mini Project</h3>
        <p>Reward: 200 XP</p>
        <p class="status">Status: Incomplete</p>
        <button class="completeBtn">Complete</button>
      </article>
    </section>

    <h3 id="summary">Completed: 0 / 3</h3>
  </main>

  <script src="script.js"></script>
</body>
</html>
